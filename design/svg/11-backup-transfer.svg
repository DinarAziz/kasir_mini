<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Layar 11 - Backup dan Transfer</title><g id="Frame"><clipPath id="clip11"><rect width="390" height="844" rx="28"/></clipPath><rect x="0" y="0" width="390" height="844" rx="28" fill="#ffffff"/><g id="Content" clip-path="url(#clip11)"><g id="StatusBar"><text x="24" y="30" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1b2321" text-anchor="start">9.41</text><rect x="338" y="18" width="24" height="12" rx="3" fill="none" stroke="#1b2321" stroke-width="1.5"/><rect x="340" y="20" width="14" height="8" rx="1" fill="#1b2321"/></g><g id="AppBar"><path d="M32 74H14M22 66L14 74L22 82" fill="none" stroke="#1b2321" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="81" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1b2321" text-anchor="start">Backup &amp; Transfer</text><line x1="0" y1="104" x2="390" y2="104" stroke="#d2d8d2" stroke-width="1"/></g><text x="16" y="136" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#1b2321" text-anchor="start">Data toko tersimpan di HP ini.</text><text x="16" y="158" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6762" text-anchor="start">Salin backup, kirim ke HP lain lewat WhatsApp,</text><text x="16" y="176" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6762" text-anchor="start">Catatan, atau email, lalu tempel di HP tujuan.</text><g id="SummaryStats"><rect x="16" y="196" width="358" height="68" rx="12" fill="none" stroke="#d2d8d2" stroke-width="1.5"/><line x1="195" y1="196" x2="195" y2="264" stroke="#d2d8d2" stroke-width="1.5"/><text x="32" y="220" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6762" text-anchor="start">Produk</text><text x="32" y="248" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="20" font-weight="500" fill="#1b2321" text-anchor="start">10</text><text x="211" y="220" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6762" text-anchor="start">Transaksi</text><text x="211" y="248" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="20" font-weight="500" fill="#1b2321" text-anchor="start">3</text></g><text x="16" y="290" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6762" text-anchor="start">Backup terakhir: belum pernah</text><text x="16" y="328" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#5b6762" text-anchor="start" letter-spacing="0.7">BACKUP</text><g id="CopyBackupButton"><rect x="16" y="340" width="358" height="48" rx="10" fill="#0b6e79" stroke="#0b6e79" stroke-width="1.5"/><text x="195.0" y="369.0" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Salin data backup</text></g><text x="16" y="412" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6762" text-anchor="start">Berisi semua produk, stok, dan riwayat transaksi.</text><text x="16" y="456" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#5b6762" text-anchor="start" letter-spacing="0.7">PULIHKAN</text><g id="RestoreButton"><rect x="16" y="468" width="358" height="48" rx="10" fill="#ffffff" stroke="#1b2321" stroke-width="1.5"/><text x="195.0" y="497.0" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1b2321" text-anchor="middle">Tempel &amp; pulihkan data</text></g><g id="WarningBox"><rect x="16" y="540" width="358" height="64" rx="10" fill="#fbe9cd"/><text x="30" y="566" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#8f5200" text-anchor="start">Memulihkan akan mengganti semua produk dan</text><text x="30" y="585" font-family="'IBM Plex Sans', Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#8f5200" text-anchor="start">riwayat di HP ini. Salin backup dulu jika ragu.</text></g></g><rect x="1" y="1" width="388" height="842" rx="27" fill="none" stroke="#1b2321" stroke-width="2"/></g></svg>